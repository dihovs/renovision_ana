# `fly launch` will regenerate parts of this on first deploy — the settings
# that matter and must survive that are min_machines_running (1, not the
# default 0) and auto_stop_machines (false). A voice call cannot wait for a
# scaled-to-zero machine to cold-start before it says hello.
app = "renovision-voice-relay"
primary_region = "yul"  # Montreal — closest Fly region to Laval; lower audio latency.

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
