name: Deploy to Vercel

# Fallback path only: the simplest, most robust way to get this repo onto
# Vercel is importing it in the Vercel dashboard, which installs Vercel's
# own GitHub App and gets automatic preview/production deploys with zero
# secrets shared with any CI job. This workflow exists for cases where
# that native integration isn't wanted — e.g. deploying on demand without
# giving Vercel App access to the whole repo. It needs three repo secrets
# (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN      https://vercel.com/account/tokens
#   VERCEL_ORG_ID      \_ from `npx vercel link` run once locally,
#   VERCEL_PROJECT_ID /   in the generated .vercel/project.json
# Runs on GitHub's own runners, so it isn't affected by any sandboxed
# session's network restrictions.

on:
  workflow_dispatch:
    inputs:
      production:
        description: "Deploy to production (unchecked = preview)"
        type: boolean
        default: false
  push:
    branches:
      - claude/slk-company-website-1ezyau

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes \
            --environment=${{ (github.event.inputs.production == 'true') && 'production' || 'preview' }} \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ github.event.inputs.production }}" = "true" ]; then
            vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          else
            vercel build --token="${{ secrets.VERCEL_TOKEN }}"
          fi

      - name: Deploy
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ github.event.inputs.production }}" = "true" ]; then
            url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          else
            url=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "SLK demo: $url/slk" >> "$GITHUB_STEP_SUMMARY"
